[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bot"
version = "0.1.0"
description = "loops Grok Bot helper: emit and check /goal prompts for cloud coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Glenson Dsouza" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grok-bot = "grok_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
